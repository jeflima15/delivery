name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run audit:prod
      - name: Basic secret scan
        run: '! git grep -En "(mongodb\\+srv://[^:]+:[^@]+@|sb_secret_|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)" -- ":(exclude)package-lock.json" ":(exclude).env.example" ":(exclude).github/workflows/ci.yml"'
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
