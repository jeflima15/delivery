openapi: 3.1.0
info:
  title: Delivery SaaS API
  version: 1.0.0
  description: Contrato principal multi-tenant. Valores monetarios de dominio usam centavos.
servers:
  - url: /
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: delivery_session
    csrfToken:
      type: apiKey
      in: header
      name: x-csrf-token
  schemas:
    Error:
      type: object
      required: [success, error, requestId]
      properties:
        success: { const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        requestId: { type: string }
    OrderInput:
      type: object
      required: [customer, items, deliveryType, paymentMethod]
      properties:
        customer:
          type: object
          required: [name, phone]
          properties:
            name: { type: string }
            phone: { type: string }
            address: { type: string }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity, options]
            properties:
              productId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
              quantity: { type: integer, minimum: 1, maximum: 99 }
              options:
                type: array
                items:
                  type: object
                  required: [groupId, itemId, quantity]
                  properties:
                    groupId: { type: string }
                    itemId: { type: string }
                    quantity: { type: integer, minimum: 1 }
        deliveryType: { enum: [delivery, pickup] }
        paymentMethod: { enum: [pix, card, cash] }
        couponCode: { type: string }
        shippingQuoteId: { type: string }
paths:
  /api/public/stores/{slug}/store:
    get:
      summary: Configuracao publica da loja
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Loja publica }
        '404': { description: Loja inexistente }
        '423': { description: Loja indisponivel }
  /api/public/stores/{slug}/catalog:
    get:
      summary: Catalogo isolado por loja
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Categorias e produtos }
  /api/customer/stores/{slug}/orders:
    post:
      summary: Cria pedido recalculado no servidor
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '201': { description: Pedido criado ou resposta idempotente }
        '409': { description: Estoque, regra ou idempotencia em conflito }
  /api/customer/stores/{slug}/tracking/{token}:
    get:
      summary: Rastreio opaco sem PII
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Estado minimo do pedido }
        '404': { description: Token invalido }
  /api/platform/auth/admin/login:
    post:
      summary: Login admin ou Master
      responses:
        '200': { description: Cookies de sessao emitidos }
        '401': { description: Credenciais ou MFA invalidos }
  /api/tenant/stores/{slug}/me:
    get:
      security: [{ sessionCookie: [] }]
      summary: Conta, loja, membership e permissoes efetivas da sessao
      responses:
        '200': { description: Sessao administrativa da loja }
        '403': { description: Membership/permissao invalida }
  /api/tenant/stores/{slug}/dashboard:
    get:
      security: [{ sessionCookie: [] }]
      summary: Metricas operacionais, serie semanal e pedidos recentes da loja
      responses:
        '200': { description: Dashboard isolado por tenant }
        '403': { description: Membership/permissao invalida }
  /api/tenant/stores/{slug}/orders:
    get:
      security: [{ sessionCookie: [] }]
      summary: Pedidos paginados da loja
      responses:
        '200': { description: Lista de pedidos }
  /api/tenant/stores/{slug}/orders/{id}/status:
    patch:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Atualiza o status de um pedido da loja
      responses:
        '200': { description: Pedido atualizado e auditado }
        '409': { description: Transicao de status invalida }
  /api/tenant/stores/{slug}/products:
    get:
      security: [{ sessionCookie: [] }]
      summary: Produtos administrativos da loja
      responses: { '200': { description: Lista de produtos } }
    post:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cria produto na loja
      responses: { '201': { description: Produto criado } }
  /api/tenant/stores/{slug}/products/{id}:
    put:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Atualiza produto pertencente a loja
      responses: { '200': { description: Produto atualizado } }
    delete:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Exclui produto apos confirmacao de identidade
      responses: { '200': { description: Produto excluido } }
  /api/tenant/stores/{slug}/products/{id}/toggle-active:
    patch:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Alterna a visibilidade do produto
      responses: { '200': { description: Produto atualizado } }
  /api/tenant/stores/{slug}/products/{id}/toggle-sold-out:
    patch:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Alterna a disponibilidade do produto
      responses: { '200': { description: Produto atualizado } }
  /api/tenant/stores/{slug}/categories:
    get:
      security: [{ sessionCookie: [] }]
      summary: Categorias administrativas da loja
      responses: { '200': { description: Lista de categorias } }
    post:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cria categoria na loja
      responses: { '201': { description: Categoria criada } }
  /api/tenant/stores/{slug}/categories/{id}:
    put:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Atualiza categoria da loja
      responses: { '200': { description: Categoria atualizada } }
    delete:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Exclui categoria vazia da loja
      responses: { '200': { description: Categoria excluida } }
  /api/tenant/stores/{slug}/catalog/structure:
    get:
      security: [{ sessionCookie: [] }]
      summary: Estrutura ordenada de categorias e produtos da loja
      responses:
        '200': { description: Categorias, produtos e itens sem categoria }
        '403': { description: Membership/permissao invalida }
    put:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Persiste ordem e categoria dos produtos em lote
      responses:
        '200': { description: Estrutura validada e atualizada }
        '400': { description: Documento nao pertence ao tenant }
  /api/tenant/stores/{slug}/settings:
    get:
      security: [{ sessionCookie: [] }]
      summary: Configuracoes administrativas completas da loja
      responses: { '200': { description: Configuracoes da loja } }
    put:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Atualiza aparencia, operacao, entrega, pagamento e fidelidade
      responses: { '200': { description: Configuracoes atualizadas } }
  /api/tenant/stores/{slug}/home-blocks:
    get:
      security: [{ sessionCookie: [] }]
      summary: Blocos da home da loja
      responses: { '200': { description: Lista ordenada de blocos } }
    post:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cria bloco da home
      responses: { '201': { description: Bloco criado } }
  /api/tenant/stores/{slug}/home-blocks/{id}:
    put:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Atualiza bloco da home
      responses: { '200': { description: Bloco atualizado } }
    delete:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Exclui bloco da home
      responses: { '200': { description: Bloco excluido } }
  /api/tenant/stores/{slug}/home-blocks/reorder:
    put:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Persiste a ordem dos blocos em lote
      responses: { '200': { description: Ordem atualizada } }
  /api/tenant/stores/{slug}/customers:
    get:
      security: [{ sessionCookie: [] }]
      summary: Clientes da loja com agregados de pedidos
      responses: { '200': { description: Lista paginada de clientes } }
  /api/tenant/stores/{slug}/customers/{id}/points:
    patch:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Ajusta pontos do cliente da loja
      responses: { '200': { description: Cliente atualizado } }
  /api/tenant/stores/{slug}/coupons:
    get:
      security: [{ sessionCookie: [] }]
      summary: Cupons da loja
      responses: { '200': { description: Lista de cupons } }
    post:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cria cupom da loja
      responses: { '201': { description: Cupom criado } }
  /api/tenant/stores/{slug}/coupons/{id}:
    delete:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Exclui cupom da loja
      responses: { '200': { description: Cupom excluido } }
  /api/tenant/stores/{slug}/audit:
    get:
      security: [{ sessionCookie: [] }]
      summary: Eventos administrativos auditados da loja
      responses: { '200': { description: Lista paginada de eventos } }
  /api/tenant/stores/{slug}/uploads/sign:
    post:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Assina upload no caminho isolado do tenant
      responses: { '200': { description: Token, caminho e URL publica do upload } }
  /api/tenant/stores/{slug}/customers/{id}/anonymize:
    post:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Anonimiza cliente da propria loja com auditoria
      responses:
        '200': { description: Dados anonimizados }
        '403': { description: Permissao insuficiente }
  /api/master/tenants:
    get:
      security: [{ sessionCookie: [] }]
      summary: Lista global para Master com MFA
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: planId, in: query, schema: { type: string } }
        - { name: subscriptionStatus, in: query, schema: { type: string } }
        - { name: invoiceStatus, in: query, schema: { type: string } }
        - { name: hasOrders, in: query, schema: { type: boolean } }
        - { name: createdFrom, in: query, schema: { type: string, format: date } }
        - { name: createdTo, in: query, schema: { type: string, format: date } }
        - { name: sort, in: query, schema: { enum: [recent, oldest, name, activity, gmv, orders, revenue, due] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Lojas paginadas }
        '403': { description: Papel ou MFA ausente }
  /api/master/session:
    get:
      security: [{ sessionCookie: [] }]
      summary: Sessao e identidade do Admin Master
      responses:
        '200': { description: Conta Master autenticada }
  /api/master/dashboard:
    get:
      security: [{ sessionCookie: [] }]
      summary: KPIs, series e central de atencao por periodo
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Metricas globais agregadas em centavos }
  /api/master/tenants/{id}:
    get:
      security: [{ sessionCookie: [] }]
      summary: Detalhe agregado da loja
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Loja, assinatura, faturas, acessos, metricas e atividade }
    patch:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Atualiza dados cadastrais da loja
      responses:
        '200': { description: Loja atualizada }
  /api/master/plans:
    get:
      security: [{ sessionCookie: [] }]
      summary: Planos paginados com assinaturas ativas
      responses: { '200': { description: Lista de planos } }
    post:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cria plano
      responses: { '201': { description: Plano criado } }
  /api/master/subscriptions:
    get:
      security: [{ sessionCookie: [] }]
      summary: Assinaturas globais com loja e plano
      responses: { '200': { description: Lista paginada } }
  /api/master/invoices:
    get:
      security: [{ sessionCookie: [] }]
      summary: Faturas globais com resumos por status
      responses: { '200': { description: Valores retornados em centavos } }
    post:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cria fatura manual vinculada a uma assinatura da mesma loja
      responses: { '201': { description: Fatura criada com valor persistido em centavos } }
  /api/master/invoices/{id}/mark-paid:
    post:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Registra pagamento manual com data, motivo e referencia
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Pagamento auditado } }
  /api/master/invoices/{id}/cancel:
    post:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Cancela fatura elegivel com motivo
      responses: { '200': { description: Fatura cancelada } }
  /api/master/invoices/{id}/refund:
    post:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Estorna fatura paga com motivo
      responses: { '200': { description: Fatura estornada } }
  /api/master/accesses:
    get:
      security: [{ sessionCookie: [] }]
      summary: Memberships administrativas globais
      responses: { '200': { description: Lista paginada sem credenciais } }
  /api/master/activity:
    get:
      security: [{ sessionCookie: [] }]
      summary: Atividade administrativa normalizada e paginada
      responses: { '200': { description: Lista de atividades } }
  /api/master/reports/{reportKey}:
    get:
      security: [{ sessionCookie: [] }]
      summary: Relatorio gerencial agregado
      parameters:
        - { name: reportKey, in: path, required: true, schema: { enum: [store-growth, revenue, store-ranking, tenant-status, tenant-plan, mrr-by-plan, trials-ending, inactive-stores] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses: { '200': { description: Serie ou ranking agregado } }
  /api/master/search:
    get:
      security: [{ sessionCookie: [] }]
      summary: Busca global limitada e agrupada
      responses: { '200': { description: Lojas, acessos, faturas e planos } }
  /api/master/settings:
    get:
      security: [{ sessionCookie: [] }]
      summary: Preferencias globais sem segredos
      responses: { '200': { description: Configuracoes e build } }
    put:
      security: [{ sessionCookie: [], csrfToken: [] }]
      summary: Atualiza preferencias globais
      responses: { '200': { description: Configuracoes atualizadas } }
