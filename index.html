<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Loja Delivery | Carregando...</title>
  <meta name="description" content="Faça seu pedido online de forma rápida e fácil!" />

  <meta property="og:title" content="Loja Delivery" />
  <meta property="og:description" content="Confira nosso cardápio e faça seu pedido pelo WhatsApp!" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://delivery-peach-beta.vercel.app/logo-preview.png" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 0; background-color: #f8f9fa; font-family: sans-serif; }

    #initial-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 20px;
      background-color: #f8f9fa;
    }

    #initial-loading .spinner {
      width: 52px;
      height: 52px;
      border: 5px solid #e5e7eb;
      border-top-color: #059669;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    #initial-loading p {
      color: #9ca3af;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="initial-loading">
      <div class="spinner"></div>
      <p>Carregando cardápio...</p>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
