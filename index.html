<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/brand/pode-vir-mark-small.png" />
  <link rel="apple-touch-icon" href="/brand/pode-vir-mark.png" />
  <meta name="theme-color" content="#08665c" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <!--page-metadata-->
  <title>Pode Vir</title>
  <meta name="description" content="Acesse sua loja na Pode Vir." />
  <!--/page-metadata-->

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 0; background-color: #f7f8f3; font-family: 'Rubik', sans-serif; }

    #initial-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 20px;
      background-color: #f7f8f3;
    }

    #initial-loading .spinner {
      width: 52px;
      height: 52px;
      border: 5px solid #e5e7eb;
      border-top-color: #08665c;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    #initial-loading p {
      color: #9ca3af;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #initial-loading .spinner { animation: none; }
    }
  </style>
</head>

<body>
  <div id="root">
    <!--app-html-->
    <div id="initial-loading" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p>Carregando Pode Vir...</p>
    </div>
    <!--/app-html-->
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
