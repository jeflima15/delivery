<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/brand/pode-vir-mark.png" />
  <link rel="apple-touch-icon" href="/brand/pode-vir-mark.png" />
  <meta name="theme-color" content="#08665c" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <title>Pode Vir | Cardápio, pedidos e gestão para sua loja</title>
  <meta name="description" content="Crie uma vitrine com a sua marca e organize cardápio, pedidos, delivery, retirada e clientes em um só painel." />

  <meta property="og:title" content="Pode Vir | Sua loja online. Seus pedidos no controle." />
  <meta property="og:description" content="Cardápio, pedidos, delivery, retirada e gestão para sua loja em um só painel." />
  <meta property="og:site_name" content="Pode Vir" />
  <meta property="og:type" content="website" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 0; background-color: #f7f8f3; font-family: 'Rubik', sans-serif; }

    #initial-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 20px;
      background-color: #f7f8f3;
    }

    #initial-loading .spinner {
      width: 52px;
      height: 52px;
      border: 5px solid #e5e7eb;
      border-top-color: #08665c;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    #initial-loading p {
      color: #9ca3af;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="initial-loading">
      <div class="spinner"></div>
      <p>Carregando cardápio...</p>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
